spring:
  datasource:
    url: jdbc:mysql://localhost:3306/portfolio_manager
    username: root
    password: root
  jpa:
    hibernate.ddl-auto: validate   # schema changes ONLY via Flyway, never auto-generated
  flyway:
    enabled: true
portfolio:
  home-currency-default: INR
  price-feed:
    provider: yahoo-finance        # no API key required
  chatbot:
    provider: ${CHATBOT_PROVIDER:groq}   # groq | gemini
    groq:
      api-key: ${GROQ_API_KEY}
      model: ${GROQ_MODEL:llama-3.3-70b-versatile}
    gemini:
      api-key: ${GEMINI_API_KEY}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
